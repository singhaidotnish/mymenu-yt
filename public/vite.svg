<svg xmlns="http://www.w3.org/2000/svg" width="400" height="410" viewBox="0 0 400 410">
  <defs>

    <!-- Outer metal ring gradient -->
    <radialGradient id="metal-ring" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="30%" stop-color="#d0d0d0"/>
      <stop offset="70%" stop-color="#909090"/>
      <stop offset="100%" stop-color="#606060"/>
    </radialGradient>

    <!-- Inner ring dark bevel -->
    <radialGradient id="inner-ring" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>

    <!-- Black glossy dome center -->
    <radialGradient id="dome-black" cx="38%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="30%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <!-- Glass gloss on dome -->
    <radialGradient id="dome-gloss" cx="36%" cy="25%" r="48%">
      <stop offset="0%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Bolt gradient: green top-left to yellow bottom-right -->
    <linearGradient id="bolt-color" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44cc00"/>
      <stop offset="50%" stop-color="#aacc00"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <!-- Bolt inner shadow -->
    <linearGradient id="bolt-shadow" x1="60%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome segment clips -->
    <clipPath id="clip-outer">
      <circle cx="200" cy="200" r="178"/>
    </clipPath>
    <clipPath id="clip-segments">
      <circle cx="200" cy="200" r="155"/>
    </clipPath>
    <clipPath id="clip-inner">
      <circle cx="200" cy="200" r="118"/>
    </clipPath>

    <!-- Bottom drop shadow -->
    <radialGradient id="shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Drop shadow -->
  <ellipse cx="202" cy="398" rx="148" ry="14" fill="url(#shadow-grad)"/>

  <!-- Outer metal ring -->
  <circle cx="200" cy="200" r="192" fill="url(#metal-ring)"/>

  <!-- Inner dark bevel ring -->
  <circle cx="200" cy="200" r="175" fill="url(#inner-ring)"/>

  <!-- Chrome color segments (between r=120 and r=155) -->
  <g clip-path="url(#clip-segments)">
    <!-- Blue: left -->
    <path d="M200,200 L44,140 A158,158 0 0,0 44,260 Z" fill="#4285F4"/>
    <!-- Green: bottom-left -->
    <path d="M200,200 L44,260 A158,158 0 0,0 200,358 Z" fill="#34A853"/>
    <!-- Yellow/Orange: bottom-right -->
    <path d="M200,200 L200,358 A158,158 0 0,0 356,260 Z" fill="#FBBC05"/>
    <!-- Red: top-right -->
    <path d="M200,200 L356,260 A158,158 0 0,0 356,140 Z" fill="#EA4335"/>
    <!-- Blue continues: top -->
    <path d="M200,200 L356,140 A158,158 0 0,0 200,42 Z" fill="#4285F4"/>
    <!-- Green top-left -->
    <path d="M200,200 L200,42 A158,158 0 0,0 44,140 Z" fill="#34A853"/>
    <!-- Cover inner -->
    <circle cx="200" cy="200" r="118" fill="#000"/>
  </g>

  <!-- Glossy black dome -->
  <circle cx="200" cy="200" r="118" fill="url(#dome-black)"/>

  <!-- Lightning bolt inside dome -->
  <!-- Main bolt shape -->
  <polygon
    points="215,95 148,205 182,205 148,310 258,192 220,192"
    fill="url(#bolt-color)"
    clip-path="url(#clip-inner)"
  />
  <!-- Bolt shadow layer for 3D -->
  <polygon
    points="215,95 148,205 182,205 148,310 258,192 220,192"
    fill="url(#bolt-shadow)"
    clip-path="url(#clip-inner)"
  />

  <!-- Dome gloss highlight -->
  <circle cx="200" cy="200" r="118" fill="url(#dome-gloss)"/>

  <!-- Large gloss reflection ellipse top-left of dome -->
  <ellipse cx="168" cy="148" rx="50" ry="32" fill="white" opacity="0.38" transform="rotate(-30,168,148)"/>

  <!-- Outer ring gloss -->
  <ellipse cx="148" cy="100" rx="60" ry="22" fill="white" opacity="0.18" transform="rotate(-20,148,100)"/>

  <!-- Outer metal ring edge highlight -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="white" stroke-width="0.8" opacity="0.15"/>

</svg>
